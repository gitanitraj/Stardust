<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{layout :: head(${post.title})}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><span th:utext="${breadcrumb}">path</span></li>
        </ol>
    </nav>
    <div class="d-flex justify-content-between align-items-start">
        <h2 th:text="${post.title}">Post Title</h2>
        <div sec:authorize="hasRole('ADMIN')" class="ml-3">
            <form th:action="@{/action_lockthread(post=${post.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-warning"
                        th:text="${post.locked} ? 'Unlock Thread' : 'Lock Thread'">Lock Thread</button>
            </form>
            <form th:action="@{/action_deletepost(post=${post.id})}" method="post" class="d-inline ml-1"
                  onsubmit="return confirm('Delete this post and all its comments?')">
                <button type="submit" class="btn btn-sm btn-danger">Delete Post</button>
            </form>
        </div>
    </div>
    <p class="text-muted">
        Posted by <a th:href="@{'/users/' + ${post.user.username}}"
            th:text="${post.user.username}"
            class="text-white font-weight-bold"></a>
        &mdash; <span th:text="${post.timeString}">time</span>
        <span th:if="${post.locked}" class="badge badge-secondary ml-2">🔒 Locked</span>
    </p>
    <div class="card mb-4">
        <div class="card-body" th:utext="${postHtml}">Content here</div>
    </div>
    <div class="mb-4">
        <div class="d-flex flex-wrap">
            <span class="badge badge-pill badge-light mr-2 mb-2"
                th:each="entry : ${reactionCounts.entrySet()}">
                <span th:text="${entry.key}">👍</span>
                <span th:text="${entry.value}">1</span>
            </span>
        </div>
        <div sec:authorize="isAuthenticated()" class="mb-3">
            <form th:action="@{/action_reaction(post=${post.id})}"
                method="post"
                class="d-flex flex-wrap gap-2">
                <button type="submit" name="emoji" value="👍" class="btn btn-outline-secondary btn-sm">👍</button>
                <button type="submit" name="emoji" value="👎" class="btn btn-outline-secondary btn-sm">👎</button>
                <button type="submit" name="emoji" value="❤️" class="btn btn-outline-secondary btn-sm">❤️</button>
                <button type="submit" name="emoji" value="😂" class="btn btn-outline-secondary btn-sm">😂</button>
                <button type="submit" name="emoji" value="😮" class="btn btn-outline-secondary btn-sm">😮</button>
                <button type="submit" name="emoji" value="😢" class="btn btn-outline-secondary btn-sm">😢</button>
                <button type="submit" name="emoji" value="😡" class="btn btn-outline-secondary btn-sm">😡</button>
            </form>
        </div>
    </div>
    <h5>Comments (<span th:text="${#lists.size(comments)}">0</span>)</h5>
    <div th:each="comment, iterStat : ${comments}" class="comment-block">
        <p th:utext="${commentHtmlList[iterStat.index]}">Comment content</p>
        <div class="d-flex justify-content-between align-items-center">
            <small class="text-muted">
                by <a th:href="@{'/users/' + ${comment.user.username}}"
                    th:text="${comment.user.username}"
                    class="text-white font-weight-bold"></a>
                &mdash; <span th:text="${comment.timeString}">time</span>
            </small>
            <div sec:authorize="hasRole('ADMIN')">
                <form th:action="@{/action_deletecomment(comment=${comment.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Delete this comment?')">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </div>
        </div>
    </div>
    <div th:if="${comments.isEmpty()}" class="text-muted">No comments yet.</div>
    <div th:if="${post.locked}" class="mt-4 alert alert-secondary">
        🔒 This thread is locked. No new comments can be posted.
    </div>
    <div sec:authorize="isAuthenticated()" th:unless="${post.locked}" class="mt-4">
        <h5>Add a Comment</h5>

        <div class="mb-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="insertMarkdown('**', '**')">Bold</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="insertMarkdown('*', '*')">Itlaic</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="insertMarkdown('#', '')">Heading</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="insertMarkdown('- ', '')">List</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="insertMarkdown('[', '](https://example.com)')">Link</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="insertMarkdown('`', '`')">Code</button>
        </div>
        <form method="post">
            <input type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"/>
            <div class="form-group">
                <textarea id="commentContent"
                            name="content"
                            class="form-control"
                            rows="4"
                            required
                            placeholder="Write your comment here..."
                            th:text="${commentContent}"></textarea>
            </div>
            <button type="submit"
                    th:formaction="@{/action_comment(post=${post.id})}"
                    class="btn btn-primary">Submit Comment</button>
            <button type="submit"
                    th:formaction="@{/preview_comment(post=${post.id})}"
                    class="btn btn-secondary">Preview</button>
        </form>
        <div th:if="${isCommentPreview}" class="mt-3">
            <h6>Preview</h6>
            <div class="card">
                <div class="card-body" th:utext="${commentPreviewHtml}"></div>
            </div>
        </div>
        </div>
    <div sec:authorize="!isAuthenticated()" class="mt-4 text-muted">
        <a th:href="@{/loginform}">Login</a> to post a comment.
    </div>
</div>
<script>
function insertMarkdown(before, after) {
    const textarea = document.getElementById("commentContent");
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const selectedText = textarea.value.substring(start, end);

    const textToInsert = selectedText || "text";
    const replacement = before + textToInsert + after;

    textarea.value =
        textarea.value.substring(0, start) +
        replacement +
        textarea.value.substring(end);

    textarea.focus();

    const cursorStart = start + before.length;
    const cursorEnd = cursorStart + textToInsert.length;

    textarea.selectionStart = cursorStart;
    textarea.selectionEnd = cursorEnd;
}
</script>
</body>
</html>
