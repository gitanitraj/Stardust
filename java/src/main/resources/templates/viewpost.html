<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{layout :: head(${post.title})}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><span th:utext="${breadcrumb}">path</span></li>
        </ol>
    </nav>
    <h2 th:text="${post.title}">Post Title</h2>
    <p class="text-muted">
        Posted by <strong th:text="${post.user.username}">author</strong>
        &mdash; <span th:text="${post.timeString}">time</span>
    </p>
    <div class="card mb-4">
        <div class="card-body" th:utext="${postHtml}">Content here</div>
    </div>
    <h5>Comments (<span th:text="${#lists.size(comments)}">0</span>)</h5>
    <div th:each="comment, iterStat : ${comments}" class="comment-block">
        <p th:utext="${commentHtmlList[iterStat.index]}">Comment content</p>
        <small class="text-muted">
            by <strong th:text="${comment.user.username}">author</strong>
            &mdash; <span th:text="${comment.timeString}">time</span>
        </small>
    </div>
    <div th:if="${comments.isEmpty()}" class="text-muted">No comments yet.</div>
    <div sec:authorize="isAuthenticated()" class="mt-4">
        <h5>Add a Comment</h5>

        <div class="mb-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="insertMarkdown('**', '**')">Bold</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="insertMarkdown('*', '*')">Itlaic</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="insertMarkdown('#', '')">Heading</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="insertMarkdown('- ', '')">List</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="insertMarkdown('[', '](https://example.com)')">Link</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="insertMarkdown('`', '`')">Code</button>
        </div>
        <form method="post">
            <div class="form-group">
                <textarea id="commentContent"
                            name="content"
                            class="form-control"
                            rows="4"
                            required
                            placeholder="Write your comment here..."
                            th:text="${commentContent}"></textarea>
            </div>
            <button type="submit"
                    th:formaction="@{/preview_comment(post=${post.id})}"
                    class="btn btn-secondary">Preview</button>
        </form>
        <div th:if="${isCommentPreview}" class="mt-3">
            <h6>Preview</h6>
            <div class="card">
                <div class="card-body" th:utext="${commentPreviewHtml}"></div>
            </div>
        </div>
        </div>
    <div sec:authorize="!isAuthenticated()" class="mt-4 text-muted">
        <a th:href="@{/loginform}">Login</a> to post a comment.
    </div>
</div>
<script>
function insertMarkdown(before, after) {
    const textarea = document.getElementById("commentContent");
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const selectedText = textarea.value.substring(start, end);

    const textToInsert = selectedText || "text";
    const replacement = before + textToInsert + after;

    textarea.value =
        textarea.value.substring(0, start) +
        replacement +
        textarea.value.substring(end);

    textarea.focus();

    const cursorStart = start + before.length;
    const cursorEnd = cursorStart + textToInsert.length;

    textarea.selectionStart = cursorStart;
    textarea.selectionEnd = cursorEnd;
}
</script>
</body>
</html>
