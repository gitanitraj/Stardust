<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Inbox</title>
</head>

<body>

    <div th:replace="header :: header"></div>

    <div class="container mt-4">

        <h1>Inbox</h1>

        <p>
            <a href="/messages/compose">Compose Message</a> |
            <a href="/messages/inbox">Inbox</a> |
            <a href="/messages/sent">Sent Messages</a>
        </p>

        <hr>

        <div th:if="${messages == null || #lists.isEmpty(messages)}">
            <p>Your inbox is empty.</p>
            <p>
                <a href="/messages/compose">Send a message</a>
            </p>
        </div>

        <div th:if="${messages != null}" th:each="message : ${messages}">
            <div>
                <p th:if="${message.readStatus == false}" style="color: green; font-weight: bold;">
                    NEW
                </p>

                <p>
                    <strong>Subject:</strong>
                    <a th:href="@{/messages/{id}(id=${message.id})}" th:text="${message.subject}">
                        Subject
                    </a>
                </p>

                <p>
                    <strong>From:</strong>
                    <span th:text="${message.sender.username}">sender</span>
                </p>

                <p>
                    <strong>Sent:</strong>
                    <span th:text="${message.sentAt}">date time</span>
                </p>
            </div>

            <hr>
        </div>

    </div>

</body>

</html>
