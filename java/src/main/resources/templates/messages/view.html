<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>View Message</title>
</head>

<body>

    <div th:replace="header :: header"></div>

    <div class="container mt-4">

        <h1 th:text="${message.subject}">Message Subject</h1>

        <p>
            <a href="/messages/inbox">Inbox</a> |
            <a href="/messages/sent">Sent Messages</a> |
            <a href="/messages/compose">Compose Message</a>
        </p>

        <hr>

        <p>
            <strong>From:</strong>
            <span th:text="${message.sender.username}">sender</span>
        </p>

        <p>
            <strong>To:</strong>
            <span th:text="${message.receiver.username}">receiver</span>
        </p>

        <p>
            <strong>Sent:</strong>
            <span th:text="${message.sentAt}">date time</span>
        </p>

        <hr>

        <h3>Message</h3>

        <p th:text="${message.body}">message body</p>

    </div>

</body>

</html>
