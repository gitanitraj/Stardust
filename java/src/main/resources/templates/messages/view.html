<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>View Message</title>
</head>

<body>

    <h1 th:text="${message.subject}">Message Subject</h1>

    <a href="/messages/inbox">Inbox</a> |
    <a href="/messages/sent">Sent Messages</a> |
    <a href="/messages/compose">Compose Message</a> |
    <a href="/">Home</a>

    <hr>

    <p>
        <strong>From:</strong>
        <span th:text="${message.sender.username}"></span>
    </p>

    <p>
        <strong>To:</strong>
        <span th:text="${message.receiver.username}"></span>
    </p>

    <p>
        <strong>Sent:</strong>
        <span th:text="${message.sentAt}"></span>
    </p>

    <hr>

    <p th:text="${message.body}"></p>

</body>

</html>
