<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Compose Message</title>
</head>

<body>

    <div th:replace="header :: header"></div>

    <div class="container mt-4">

        <div th:if="${successMessage}" style="color: green; font-weight: bold;">
            <p th:text="${successMessage}">Message sent successfully!</p>
        </div>

        <div th:if="${errorMessage}" style="color: red; font-weight: bold;">
            <p th:text="${errorMessage}">Error message</p>
        </div>

        <h1>Compose Message</h1>

        <p>
            <a href="/messages/inbox">Inbox</a> |
            <a href="/messages/sent">Sent Messages</a>
        </p>

        <hr>

        <form method="post" th:action="@{/messages/compose}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <p>
                <label for="receiverUsername"><strong>To Username:</strong></label><br>
                <input type="text" id="receiverUsername" name="receiverUsername" placeholder="Enter receiver username"
                    required>
            </p>

            <p>
                <label for="subject"><strong>Subject:</strong></label><br>
                <input type="text" id="subject" name="subject" placeholder="Enter message subject" required>
            </p>

            <p>
                <label for="body"><strong>Message:</strong></label><br>
                <textarea id="body" name="body" rows="8" cols="60" placeholder="Type your message here..."
                    required></textarea>
            </p>

            <button type="submit">Send Message</button>
        </form>

    </div>

</body>

</html>
