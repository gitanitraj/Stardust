<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Compose Message</title>
    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .messages-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 25px;
        }

        .compose-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .page-title {
            font-size: 32px;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .message-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .message-nav a {
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            background: #343a40;
            color: white;
            font-weight: bold;
        }

        .message-nav a:hover {
            background: #0d6efd;
        }

        .success-box {
            background: #d1e7dd;
            color: #0f5132;
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .error-box {
            background: #f8d7da;
            color: #842029;
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .send-button {
            background: #0d6efd;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .send-button:hover {
            background: #084298;
        }
    </style>
</head>

<body>

    <div th:replace="header :: header"></div>

    <div class="messages-container">

        <div th:if="${successMessage}" class="success-box">
            <span th:text="${successMessage}">Message sent successfully!</span>
        </div>

        <div th:if="${errorMessage}" class="error-box">
            <span th:text="${errorMessage}">Error message</span>
        </div>

        <div class="message-nav">
            <a href="/messages/inbox">Inbox</a>
            <a href="/messages/sent">Sent</a>
        </div>

        <div class="compose-card">
            <h1 class="page-title">Compose Message</h1>
            <p class="subtitle">Send a private message to another registered user.</p>

            <form method="post" th:action="@{/messages/compose}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label for="receiverUsername">To Username</label>
                    <input type="text" id="receiverUsername" name="receiverUsername"
                        placeholder="Enter receiver username" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="Enter message subject" required>
                </div>

                <div class="form-group">
                    <label for="body">Message</label>
                    <textarea id="body" name="body" rows="8" placeholder="Type your message here..."
                        required></textarea>
                </div>

                <button type="submit" class="send-button">Send Message</button>
            </form>
        </div>

    </div>

</body>

</html>
