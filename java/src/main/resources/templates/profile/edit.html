<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Profile</title>
</head>
<body>
<h1>Edit Profile</h1>
<form th:action="@{/settings/profile}" method="post">
    <label>Display Name:</label>
    <input type="text" name="displayName" th:value="${user.displayName}">

    <br><br>

    <label>Bio:</label>
    <textarea name="bio" rows="5" cols="40"
              th:text="${user.bio}"></textarea>

    <br><br>

    <button type="submit">Save Changes</button>
</form>
<h3>Avatar</h3>

<form th:action="@{/settings/profile/avatar}" 
      method="post" 
      enctype="multipart/form-data">

    <label>Upload New Avatar:</label>
    <input type="file" name="avatar">

    <br><br>

    <button type="submit">Upload Avatar</button>
</form>
<br>
<a th:href="@{'/users/' + ${user.username}}">Back to Profile</a>
</body>
</html>
