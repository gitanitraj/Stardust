<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{layout :: head(${profileUser.username} + ' - Profile')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container mt-4">

    <div class="profile-card mb-4">
        <div class="d-flex align-items-center">
            <!-- Avatar -->
            <div class="mr-4">
                <img th:if="${profileUser.avatarUrl != null}"
                     th:src="${profileUser.avatarUrl}"
                     class="avatar avatar-lg"
                     alt="avatar"/>
                <span th:unless="${profileUser.avatarUrl != null}"
                      class="avatar-placeholder avatar-lg"
                      th:text="${profileUser.username.substring(0,1).toUpperCase()}">U</span>
            </div>
            <!-- Info -->
            <div>
                <div class="profile-username" th:text="${profileUser.username}">username</div>
                <div th:if="${profileUser.displayName != null and !profileUser.displayName.isEmpty()}"
                     class="profile-displayname"
                     th:text="${profileUser.displayName}">Display Name</div>
                <div class="profile-meta">
                    Joined <span th:text="${#temporals.format(profileUser.createdAt, 'MMMM dd, yyyy')}">date</span>
                </div>
                <div sec:authorize="isAuthenticated()" class="mt-2"
                     th:if="${#authentication.principal.username == profileUser.username}">
                    <a th:href="@{/settings/profile}" class="btn btn-sm btn-outline-secondary">Edit Profile</a>
                </div>
            </div>
        </div>

        <div th:if="${profileUser.bio != null and !profileUser.bio.isEmpty()}" class="mt-3">
            <hr/>
            <p class="profile-bio mb-0" th:text="${profileUser.bio}">Bio</p>
        </div>
    </div>

    <!-- Recent Posts -->
    <h5>Posts by <span th:text="${profileUser.username}">user</span></h5>
    <div class="list-group post-list mb-4">
        <a th:each="post : ${profileUser.posts}"
           th:href="@{/viewpost(post=${post.id})}"
           class="list-group-item list-group-item-action">
            <div class="d-flex justify-content-between">
                <strong th:text="${post.title}">Post Title</strong>
                <small class="post-meta" th:text="${post.timeString}">time</small>
            </div>
        </a>
    </div>
    <div th:if="${profileUser.posts.isEmpty()}" class="text-muted mb-4">No posts yet.</div>

    <a href="javascript:history.back()" class="btn btn-sm btn-outline-secondary">&larr; Back</a>
</div>
</body>
</html>
